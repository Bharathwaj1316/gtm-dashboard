<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Geotag Summary Table</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" integrity="sha384-vtjasyidUo0kW94K5MXDXntzOJpQgBKXmE7e2Ga4LG0skTTLeBi97eFAXsqewJjw" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js" integrity="sha384-D/t0ZMqQW31H3az8ktEiNb39wyKnS82iFY52QPACM+IjKW3jDUhyIgh2PApRqJZs" crossorigin="anonymous"></script>
<style>
  :root { --green: #1b7a43; --green-soft: #e8f5ee; --border: #dfe5e1; }
  body { font-family: 'Inter', sans-serif; background: #f4f7f5; color: #1f2a24; }
  .page { max-width: 1200px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; font-weight: 700; margin: 0; }
  .sub { color: #5d6b63; font-size: .9rem; }
  .card-box { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .kpi .label { font-size: .78rem; color: #5d6b63; text-transform: uppercase; letter-spacing: .03em; }
  .kpi .value { font-size: 1.4rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .kpi.total { background: var(--green); color: #fff; border-color: var(--green); }
  .kpi.total .label { color: #d6efe0; }
  .table-wrap { overflow-x: auto; }
  table.summary { width: 100%; border-collapse: collapse; font-size: .9rem; }
  .summary th, .summary td { padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .summary thead th { background: var(--green); color: #fff; font-weight: 600; position: sticky; top: 0; cursor: pointer; user-select: none; }
  .summary thead th.num, .summary td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .summary thead th .arrow { opacity: .6; font-size: .75em; margin-left: 4px; }
  .summary tbody tr:hover { background: var(--green-soft); }
  .summary td.total, .summary tfoot td { font-weight: 700; }
  .summary tfoot td { background: var(--green-soft); border-top: 2px solid var(--green); }
  .zero { color: #aab4ae; }
  .status { font-size: .85rem; }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2fb36a; margin-right: 6px; }
  .status.error .dot { background: #d9534f; }
  .light { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; margin-right: 8px; }
  .light[hidden] { display: none; }
  .light .dot { width: 10px; height: 10px; border-radius: 50%; background: #aab4ae; flex: none; }
  .light.checking .dot { background: #2f7fd9; animation: blink 1s infinite; }
  .light.updating .dot { background: #e8890c; animation: blink 1s infinite; }
  .light.ok .dot { background: #2fb36a; }
  .light.failed .dot { background: #d9534f; }
  @keyframes blink { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .light .dot { animation: none !important; } }
</style>
</head>
<body>
<div class="page">
  <div class="d-flex flex-wrap justify-content-between align-items-end gap-2 mb-3">
    <div>
      <h1>Geotag Summary Table</h1>
      <div class="sub">District-wise planting geotags across 5 departments · Green Tamil Nadu Mission</div>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="statusText">Loading…</span></div>
  </div>

  <div class="card-box mb-3 d-flex flex-wrap gap-3 align-items-end">
    <div>
      <label class="form-label small mb-1" for="yearFilter">Financial year</label>
      <select class="form-select form-select-sm" id="yearFilter"><option value="all">All years</option></select>
    </div>
    <div>
      <label class="form-label small mb-1" for="metric">Show</label>
      <select class="form-select form-select-sm" id="metric">
        <option value="geotags">Geotag count</option>
        <option value="seedlings">Seedlings</option>
      </select>
    </div>
    <div>
      <label class="form-label small mb-1" for="search">District</label>
      <input class="form-control form-control-sm" id="search" placeholder="Search district">
    </div>
    <div class="ms-auto d-flex gap-2">
      <button class="btn btn-outline-success btn-sm" id="refreshBtn">Refresh now</button>
      <button class="btn btn-success btn-sm" id="exportBtn">Export to Excel</button>
    </div>
  </div>

  <div class="card-box mb-3 d-flex flex-wrap gap-2 align-items-center">
    <span class="small fw-semibold me-1">Update data</span>
    <button class="btn btn-outline-secondary btn-sm" id="directExportBtn" disabled title="Coming soon">Direct Export</button>
    <button class="btn btn-outline-success btn-sm" id="gitImportBtn" title="Check the Git data for a newer file">Import from Git</button>
    <span class="light" id="gitLight" role="status"><span class="dot"></span><span id="gitLightText"></span></span>
    <button class="btn btn-outline-success btn-sm" id="manualUploadBtn" title="Show a file's totals on this screen only. The file is not sent anywhere.">Manual Upload</button>
    <input type="file" id="manualFile" accept=".csv,.gz,.xlsx,.xls" multiple hidden>
    <span class="light" id="manualLight" role="status" hidden><span class="dot"></span><span id="manualLightText"></span></span>
    <button class="btn btn-outline-secondary btn-sm" id="backToLiveBtn" hidden>Back to live data</button>
  </div>

  <div class="kpis mb-3" id="kpis"></div>

  <div class="card-box">
    <div class="table-wrap">
      <table class="summary" id="summaryTable">
        <thead><tr id="headRow"></tr></thead>
        <tbody id="tableBody"></tbody>
        <tfoot><tr id="footRow"></tr></tfoot>
      </table>
    </div>
  </div>
</div>

<script>
const DATA_URL = 'summary.json';
const REFRESH_MS = 30 * 60 * 1000;
const CHECK_URL = 'https://gtm-update-check.bharathwaj200413.workers.dev/';
const CHECK_WAIT_MS = 15 * 1000;
const CHECK_TRIES = 24;

const DEPARTMENTS = [
  { key: 'forest', label: 'Forest Department' },
  { key: 'other_dept', label: 'Other Departments' },
  { key: 'coastal_habitat', label: 'Coastal Habitat' },
  { key: 'plant_a_tree', label: 'Plant-a-Tree' },
  { key: 'agriculture', label: 'Agriculture Department' },
];
// Department name in an uploaded file -> dashboard department key
const FILE_DEPARTMENTS = {
  'Forest Department': 'forest',
  'Other Department': 'other_dept',
  'Other Departments': 'other_dept',
  'Coastal Department': 'coastal_habitat',
  'Coastal Habitat': 'coastal_habitat',
  'Plant-a-Tree': 'plant_a_tree',
  'Agriculture Department': 'agriculture',
};
// Spellings used by other exports -> Forest Department spelling (as in scraper/build_summary.py)
const DISTRICT_ALIASES = {
  KALLAKURUCHI: 'KALLAKURICHI',
  SIVAGANGAI: 'SIVAGANGA',
  THIRUPATHUR: 'TIRUPATTUR',
  TIRUPATHUR: 'TIRUPATTUR',
  THOOTHUKUDI: 'TUTICORIN',
  TRICHY: 'TIRUCHIRAPPALLI',
  TIRUCHIRAPALLI: 'TIRUCHIRAPPALLI',
  NILGIRIS: 'THE NILGIRIS',
  TIRUVALLUR: 'THIRUVALLUR',
  TIRUNELVELI: 'THIRUNELVELI',
  KANNIYAKUMARI: 'KANYAKUMARI',
};

let data = null;
let liveData = null;
let uploaded = null;
let sort = { col: 'district', dir: 1 };

const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('en-IN');
const esc = s => String(s).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);

async function load() {
  // An uploaded file stays on screen until the viewer goes back to live data
  if (uploaded) return;
  try {
    const res = await fetch(`${DATA_URL}?t=${Date.now()}`, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const fresh = await res.json();
    if (uploaded) return;
    data = fresh;
    fillYears();
    render();
    const updated = new Date(data.updated);
    setStatus(`Data updated ${updated.toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' })}`);
  } catch (err) {
    setStatus(`Could not load data (${err.message}). Showing last loaded values.`, true);
  }
}

function setLight(state, text, name = 'git') {
  const light = $(`${name}Light`);
  light.className = `light ${state}`;
  light.hidden = !text;
  $(`${name}LightText`).textContent = text;
}

function normDistrict(name) {
  const d = name.trim().replace(/\s+/g, ' ').toUpperCase();
  if (!d) return 'UNKNOWN';
  return DISTRICT_ALIASES[d] || d;
}

// Financial year (April-March) from a date; '' if there is no usable date
function yearFromDate(value) {
  let y, m;
  let match = value.match(/^(\d{4})-(\d{1,2})/);
  if (match) {
    [y, m] = [+match[1], +match[2]];
  } else if ((match = value.match(/^\d{1,2}[-/](\d{1,2})[-/](\d{4})/))) {
    [y, m] = [+match[2], +match[1]];
  } else {
    const d = new Date(value);
    if (isNaN(d)) return '';
    [y, m] = [d.getFullYear(), d.getMonth() + 1];
  }
  if (y < 2015 || m < 1 || m > 12) return '';
  const start = m >= 4 ? y : y - 1;
  return `${start}-${start + 1}`;
}

// Website exports have no Department column, so recognise them by their columns
function departmentFromColumns(columns) {
  const has = c => columns.includes(c);
  if (has('Department')) return null;
  if (has('Planted Date') && has('Number of Seedlings')) return 'plant_a_tree';
  if (has('Number of Seedlings')) return 'agriculture';
  if (has('Department Type') && has('Seedlings')) return 'other_dept';
  if (has('Division') && has('Seedlings')) return has('District') ? 'forest' : 'coastal_habitat';
  throw new Error('unrecognised columns');
}

function newTally() {
  return { total: 0, counts: new Map(), coastal: new Map(), divisions: new Map(), labels: new Map() };
}

function bump(map, key, seedlings) {
  const entry = map.get(key) || [0, 0];
  entry[0] += 1;
  entry[1] += seedlings;
  map.set(key, entry);
}

function addRow(tally, row, fixedKey) {
  const get = name => String(row[name] ?? '').trim();
  const name = get('Department');
  let key = fixedKey || FILE_DEPARTMENTS[name];
  if (!key) {
    // Never drop a row: an unexpected department still gets its own column
    const label = name || 'Unknown department';
    key = `file:${label}`;
    tally.labels.set(key, label);
  }
  const seedlings = Number(get('Seedlings') || get('Number of Seedlings')) || 0;
  const year = get('Year') || yearFromDate(get('Planted Date')) || yearFromDate(get('Reported At')) || 'Unknown';
  const district = get('District');
  const division = get('Division');
  tally.total += 1;

  if (key === 'forest' && division && district) {
    const seen = tally.divisions.get(division) || new Map();
    seen.set(district, (seen.get(district) || 0) + 1);
    tally.divisions.set(division, seen);
  }
  // Coastal Habitat has no district: map its division via Forest data
  if (key === 'coastal_habitat' && !district) {
    bump(tally.coastal, JSON.stringify([division, year]), seedlings);
  } else {
    bump(tally.counts, JSON.stringify([normDistrict(district), key, year]), seedlings);
  }
}

function summaryFromTally(tally, names) {
  for (const [id, [geotags, seedlings]] of tally.coastal) {
    const [division, year] = JSON.parse(id);
    const seen = [...(tally.divisions.get(division) || new Map())].sort((a, b) => b[1] - a[1]);
    const key = JSON.stringify([normDistrict(seen.length ? seen[0][0] : ''), 'coastal_habitat', year]);
    const entry = tally.counts.get(key) || [0, 0];
    tally.counts.set(key, [entry[0] + geotags, entry[1] + seedlings]);
  }
  const rows = [...tally.counts].map(([id, [geotags, seedlings]]) => [...JSON.parse(id), geotags, Math.trunc(seedlings)]);
  const found = new Set(rows.map(r => r[1]));
  return {
    updated: new Date().toISOString(),
    departments: [
      ...DEPARTMENTS.filter(d => found.has(d.key)),
      ...[...tally.labels].filter(([k]) => found.has(k)).map(([key, label]) => ({ key, label })),
    ],
    years: [...new Set(rows.map(r => r[2]))].sort(),
    districts: [...new Set(rows.map(r => r[0]))].sort(),
    columns: ['district', 'department', 'year', 'geotags', 'seedlings'],
    rows,
    names,
  };
}

async function csvBlob(file) {
  const head = new Uint8Array(await file.slice(0, 2).arrayBuffer());
  if (head[0] !== 0x1f || head[1] !== 0x8b) return file;
  return new Response(file.stream().pipeThrough(new DecompressionStream('gzip'))).blob();
}

async function readCsv(file, tally, progress) {
  const blob = await csvBlob(file);
  await new Promise((resolve, reject) => {
    let fixedKey;
    let checked = false;
    Papa.parse(blob, {
      header: true,
      skipEmptyLines: 'greedy',
      transformHeader: h => h.replace(/^﻿/, '').trim(),
      chunk(results, parser) {
        try {
          if (!checked) {
            fixedKey = departmentFromColumns(results.meta.fields || []);
            checked = true;
          }
          results.data.forEach(row => addRow(tally, row, fixedKey));
          progress();
        } catch (err) {
          // Reject first: abort() fires complete, which would resolve the promise
          reject(err);
          parser.abort();
        }
      },
      complete: resolve,
      error: reject,
    });
  });
}

async function readExcel(file, tally) {
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', dense: true });
  for (const sheetName of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '', raw: false });
    if (!rows.length) continue;
    const fixedKey = departmentFromColumns(Object.keys(rows[0]).map(k => k.trim()));
    rows.forEach(row => {
      const clean = Object.fromEntries(Object.entries(row).map(([k, v]) => [k.trim(), v]));
      addRow(tally, clean, fixedKey);
    });
  }
}

// The file is only read inside this browser. Nothing is sent anywhere.
async function showUploadedFiles(files) {
  const btn = $('manualUploadBtn');
  btn.disabled = true;
  const names = files.map(f => f.name).join(', ');
  setLight('checking', 'Reading file…', 'manual');
  try {
    const tally = newTally();
    for (const file of files) {
      const progress = () => setLight('checking', `Reading file… ${fmt(tally.total)} rows`, 'manual');
      if (/\.xlsx?$/i.test(file.name)) await readExcel(file, tally);
      else await readCsv(file, tally, progress);
    }
    if (!tally.total) throw new Error('no rows');
    const summary = summaryFromTally(tally, names);
    if (!uploaded) liveData = data;
    uploaded = summary;
    data = summary;
    sort = { col: 'district', dir: 1 };
    fillYears();
    render();
    const count = summary.departments.length;
    setStatus('Showing an uploaded file, not the live data');
    setLight('ok', `Showing uploaded file: ${names} · ${count} department${count === 1 ? '' : 's'} · ${fmt(tally.total)} rows`, 'manual');
    $('backToLiveBtn').hidden = false;
  } catch (err) {
    const reason = err.message === 'unrecognised columns'
      ? 'its columns were not recognised'
      : err.message === 'no rows' ? 'it has no data rows' : 'it could not be read';
    setLight('failed', `Could not use ${names}: ${reason}.`, 'manual');
  } finally {
    btn.disabled = false;
  }
}

function backToLive() {
  if (!uploaded) return;
  uploaded = null;
  $('backToLiveBtn').hidden = true;
  setLight('', '', 'manual');
  if (liveData) {
    data = liveData;
    sort = { col: 'district', dir: 1 };
    fillYears();
    render();
  }
}

// Asks the Worker whether a newer file is in gtm-data, then waits for its totals
async function importFromGit() {
  const btn = $('gitImportBtn');
  if (btn.disabled) return;
  backToLive();
  btn.disabled = true;
  setLight('checking', 'Checking…');
  const before = data && data.updated;
  try {
    for (let i = 0; i < CHECK_TRIES; i++) {
      if (i) await new Promise(done => setTimeout(done, CHECK_WAIT_MS));
      const res = await fetch(CHECK_URL, { cache: 'no-store' });
      const { status, fileUpdated } = await res.json();
      // The viewer opened a file meanwhile: leave their view alone
      if (uploaded) {
        setLight('', '');
        return;
      }
      if (status === 'failed') {
        await load();
        setLight('failed', 'Could not update from the new file. Showing the last good data.');
        return;
      }
      if (status === 'error') throw new Error('check failed');
      if (status === 'current') {
        await load();
        if (data && new Date(data.updated) >= new Date(fileUpdated)) {
          setLight('ok', data.updated === before ? 'Already up to date' : 'New data loaded');
          return;
        }
      }
      setLight('updating', 'Updating… about 2–3 minutes');
    }
    await load();
    setLight('failed', 'Update is taking longer than usual. Showing the last good data.');
  } catch (err) {
    await load();
    setLight('failed', 'Could not check for new data. Showing the last good data.');
  } finally {
    btn.disabled = false;
  }
}

function setStatus(text, error = false) {
  $('statusText').textContent = text;
  $('status').classList.toggle('error', error);
}

function fillYears() {
  const sel = $('yearFilter');
  const current = sel.value;
  const years = data.years.filter(y => y !== 'Unknown').sort().reverse();
  if (data.years.includes('Unknown')) years.push('Unknown');
  sel.innerHTML = '<option value="all">All years</option>' +
    years.map(y => `<option value="${esc(y)}">${esc(y)}</option>`).join('');
  sel.value = [...sel.options].some(o => o.value === current) ? current : 'all';
}

function aggregate() {
  const year = $('yearFilter').value;
  const metric = $('metric').value === 'seedlings' ? 4 : 3;
  const depts = data.departments.map(d => d.key);
  const byDistrict = Object.fromEntries(
    data.districts.map(d => [d, Object.fromEntries(depts.map(k => [k, 0]))])
  );
  for (const row of data.rows) {
    if (year !== 'all' && row[2] !== year) continue;
    byDistrict[row[0]][row[1]] += row[metric];
  }
  return Object.entries(byDistrict).map(([district, vals]) => ({
    district, ...vals, total: depts.reduce((s, k) => s + vals[k], 0)
  }));
}

function visibleRows() {
  const q = $('search').value.trim().toUpperCase();
  const rows = aggregate().filter(r => !q || r.district.includes(q));
  rows.sort((a, b) => {
    const x = a[sort.col], y = b[sort.col];
    return (typeof x === 'string' ? x.localeCompare(y) : x - y) * sort.dir;
  });
  return rows;
}

function render() {
  const depts = data.departments;
  const rows = visibleRows();
  const cols = [{ key: 'district', label: 'District' }, ...depts, { key: 'total', label: 'Total' }];

  $('headRow').innerHTML = '<th>S.No</th>' + cols.map(c => {
    const arrow = sort.col === c.key ? (sort.dir > 0 ? '▲' : '▼') : '';
    return `<th data-col="${esc(c.key)}" class="${c.key === 'district' ? '' : 'num'}">${esc(c.label)}<span class="arrow">${arrow}</span></th>`;
  }).join('');

  const cell = (v, cls = '') => `<td class="num ${cls} ${v === 0 ? 'zero' : ''}">${fmt(v)}</td>`;
  $('tableBody').innerHTML = rows.map((r, i) =>
    `<tr><td>${i + 1}</td><td>${esc(r.district)}</td>` +
    depts.map(d => cell(r[d.key])).join('') + cell(r.total, 'total') + '</tr>'
  ).join('');

  const totals = Object.fromEntries(cols.slice(1).map(c => [c.key, rows.reduce((s, r) => s + r[c.key], 0)]));
  $('footRow').innerHTML = '<td colspan="2">Total</td>' + cols.slice(1).map(c => cell(totals[c.key])).join('');

  const unit = $('metric').value === 'seedlings' ? 'seedlings' : 'geotags';
  $('kpis').innerHTML = depts.map(d =>
    `<div class="card-box kpi"><div class="label">${esc(d.label)}</div><div class="value">${fmt(totals[d.key])}</div></div>`
  ).join('') + `<div class="card-box kpi total"><div class="label">Total ${unit}</div><div class="value">${fmt(totals.total)}</div></div>`;
}

function exportExcel() {
  const depts = data.departments;
  const rows = visibleRows();
  const header = ['S.No', 'District', ...depts.map(d => d.label), 'Total'];
  const body = rows.map((r, i) => [i + 1, r.district, ...depts.map(d => r[d.key]), r.total]);
  const totals = ['', 'Total', ...[...depts.map(d => d.key), 'total'].map(k => rows.reduce((s, r) => s + r[k], 0))];
  const ws = XLSX.utils.aoa_to_sheet([header, ...body, totals]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Summary');
  const year = $('yearFilter').value === 'all' ? 'all-years' : $('yearFilter').value;
  XLSX.writeFile(wb, `geotag_summary_${$('metric').value}_${year}.xlsx`);
}

$('headRow').addEventListener('click', e => {
  const th = e.target.closest('th[data-col]');
  if (!th) return;
  const col = th.dataset.col;
  sort = { col, dir: sort.col === col ? -sort.dir : (col === 'district' ? 1 : -1) };
  render();
});
['yearFilter', 'metric'].forEach(id => $(id).addEventListener('change', render));
$('search').addEventListener('input', render);
$('refreshBtn').addEventListener('click', () => { backToLive(); load(); });
$('manualUploadBtn').addEventListener('click', () => $('manualFile').click());
$('manualFile').addEventListener('change', e => {
  const files = [...e.target.files];
  e.target.value = '';
  if (files.length) showUploadedFiles(files);
});
$('backToLiveBtn').addEventListener('click', () => { backToLive(); load(); });
$('gitImportBtn').addEventListener('click', importFromGit);
$('exportBtn').addEventListener('click', exportExcel);

load().then(importFromGit);
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
